            <!--    VIDEO   -->
            <section aria-label="video example">
                <h2>Watch Calming Video</h2>

                <video controls width="400" height="400">
                    <source src="/part2/assets/calming-rain.mp4" type="video/mp4">

                <p>Download the <a href="/part2/assets/calming-rain.mp4">rain video</a> here.</p>

            <br>

            <!--    AUDIO   -->
            <section aria-label="audio example">

                <p>Download <a href="/part2/assets/jungle-rain-sounds.wav"> audio </a> here.</p>
            </section>

            <br>

            <!--    CANVAS  -->
            <section aria-label="canvas example">
                <h2>Canvas</h2>

                <canvas width="120" height="120">
                    Just a blue box.
                </canvas>

                <p>
                    It's Schrodinger's box. Question is, is there a cat in there?
                </p>

                <script>
                    const canvas = document.querySelector("canvas");
                    const ctx = canvas.getContext("2d");
                    ctx.fillStyle = "blue";
                    // Add a rectangle at (10, 10) with size 100x100 pixels
                    ctx.fillRect(10, 10, 100, 50);
                </script>
                <noscript>Aww no box</noscript>
            </section>

            <br>

            <section aria-label="game template example">
